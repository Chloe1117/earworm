name: focus-probe APK

on:
  push:
    paths:
      - "focus-probe/**"
      - ".github/workflows/focus-probe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focus-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: focus-probe-debug-apk
          path: focus-probe/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
